name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"

  shell-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: bash -n deploy.sh
      - name: ShellCheck
        run: shellcheck -S error deploy.sh
      - name: Panel compose config
        env:
          PANEL_ADMIN_PASS: ci-placeholder
        run: docker compose -f deploy/panel/docker-compose.yml config --quiet
      - name: Node compose config
        env:
          REALITY_SERVER_NAME: example.com
          DOMAIN: example.com
        run: docker compose -f deploy/node/docker-compose.yml config --quiet

  # Publish the agent and panel images so deploying is a pull, not a two-minute
  # Go build on the target host. Only on main, and only after the checks pass.
  publish:
    needs: [go, shell-and-compose]
    strategy:
      matrix:
        include:
          - component: agent
            dockerfile: Dockerfile.agent
          - component: panel
            dockerfile: Dockerfile.panel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # The Go build cross-compiles, but the runtime stage runs apk under
      # emulation for the non-native architecture.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: ver
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.short }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/xuanwu-${{ matrix.component }}:latest
            ghcr.io/${{ github.repository_owner }}/xuanwu-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
